<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pyeong Eun Kim — Interactive Profile</title>
  <meta name="description" content="Interactive personal homepage with publications, experience timeline, and dark mode." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#0f1115; --bg-2:#0b0d12; --card:#151923; --card-end:#121723; --text:#e6e8ef; --muted:#9aa3b2;
      --accent:#6ee7b7; --accent2:#0084ff; --accent2-end:#0084ff; --line:#2a3040; --chip:#1c2230;
      --shadow:0 10px 30px rgba(0,0,0,.35); --box-shadow:#200bbb; --dot-shadow:rgba(0,112,249,.229);
      --header-bg-start:rgba(10,12,18,.8); --header-bg-end:rgba(10,12,18,.4);
      --heading-color: #bbc6ff;
      --kbd-bg:#0c1017; --hero-end:#131827; --pub-start:#121622; --pub-end:#10131b;
      --avatar-bg:#121622; --bar-bg:#0b0f16; --toast-bg:#0b1020; --toast-fg:#e5f2ff;
    }

    /* LIGHT THEME — flat */
    [data-theme="light"]{
      --bg:#ffffff; --bg-2:#ffffff; --card:#ffffff; --card-end:#ffffff; --text:#111827; --muted:#6b7280;
      --accent:#059669; --accent2:#27bd83; --accent2-end:#27bd83; --box-shadow:#27bd83; --dot-shadow:rgba(1,63,19,.13);
      --line:#e5e7eb; --chip:#f3f4f6; --shadow:0 4px 12px rgba(0,0,0,.06);
      --header-bg-start:#ffffff; --header-bg-end:#ffffff; --kbd-bg:#f3f4f6; --hero-end:#ffffff;
      --heading-color: #01583d;
      --pub-start:#ffffff; --pub-end:#ffffff; --avatar-bg:#f3f4f6; --bar-bg:#eef2f7; --toast-bg:#ffffff; --toast-fg:#0f172a;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:linear-gradient(180deg,var(--bg),var(--bg-2) 60%,var(--bg));
      color:var(--text); line-height:1.6;
    }

    a{color:var(--accent2); text-decoration:none}
    a:focus-visible, button:focus-visible{outline:2px solid var(--accent2); outline-offset:2px}
    
    header{
      position:sticky; top:0; z-index:50; backdrop-filter: blur(10px);
      background:linear-gradient(180deg,var(--header-bg-start),var(--header-bg-end));
      border-bottom:1px solid var(--line);
    }
    .nav{max-width:1050px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; padding:12px 20px}
    .brand{font-weight:800; letter-spacing:.3px}

    .row{max-width:1050px; margin:0 auto; padding:22px; display:grid; gap:22px}
    .hero{
      display:grid; grid-template-columns:110px 1fr auto; gap:22px; align-items:center; padding:22px;
      background:linear-gradient(180deg,var(--card),var(--hero-end));
      border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow);
    }
    .plaintext {
      font-size: 16px;
    }
    .avatar{
      width:110px; height:110px; border-radius:50%; background:var(--avatar-bg); border:2px solid var(--line); overflow:hidden;
      display:grid; place-items:center; color:var(--muted); font-weight:600; font-size:22px;
    }
    .hero h1{margin:0 0 6px; font-size:28px}
    .headline{margin:0 0 10px; color:var(--muted)}
    .chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px}
    .chip{background:var(--chip); color:var(--text); padding:6px 10px; border-radius:999px; border:1px solid var(--line); font-size:13px}
    .cta{display:flex; gap:10px}
    .btn{
      background:linear-gradient(180deg,var(--accent2),var(--accent2-end)); padding:10px 16px; color:white; border:none; border-radius:12px; cursor:pointer; font-weight:600;
      box-shadow:0 6px 18px var(--box-shadow); transition:transform .12s ease; 
    }
    .btn.alt{
      background:transparent; color:var(--text); border:1px solid var(--line); box-shadow:none;
      display:inline-flex; align-items:center; justify-content:center; font-size:14px;
    }
    /* .pub_title {
      color: #474747;
    } */
    .small {font-size: 12px}
    .btn.small{font-size:12px; padding:6px 10px}
    .btn:active{transform:translateY(1px)}

    section.card{
      background:linear-gradient(180deg,var(--card),var(--card-end)); border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:var(--shadow);
    }
    h2{margin:0 0 12px; font-size:18px; letter-spacing:.2px; color: var(--heading-color);}
    .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px}
    @media (max-width:900px){ .grid-2{grid-template-columns:1fr} .hero{grid-template-columns:80px 1fr} .avatar{width:80px;height:80px} }

    .timeline{position:relative; padding-left:14px}
    .timeline:before{content:""; position:absolute; left:2px; top:0; bottom:0; width:2px; background:linear-gradient(180deg,var(--line),transparent)}
    .item{position:relative; padding:10px 10px 10px 14px}
    .item:before{content:""; position:absolute; left:-2px; top:17px; width:8px; height:8px; border-radius:50%; background:var(--accent2); box-shadow:0 0 0 4px var(--dot-shadow)}
    .item h3{margin:0 0 6px; font-size:15px}
    .muted{color:var(--muted); font-size:14px}

    .pubs{display:grid; grid-template-columns:1fr; gap:12px}
    .pub{border:1px solid var(--line); border-radius:12px; padding:12px; background:linear-gradient(180deg,var(--pub-start),var(--pub-end))}
    .pub .meta{display:flex; flex-wrap:wrap; gap:8px; color:var(--muted); font-size:12px; margin-top:6px}
    .filters{display:flex; gap:8px; margin:6px 0 10px; flex-wrap:wrap}

    .footer{color:var(--muted); text-align:center; padding:30px 10px}
    .kbd{border:1px solid var(--line); background:var(--kbd-bg); padding:2px 6px; border-radius:6px; font-size:12px}
    .toggle{border:1px solid var(--line); background:transparent; color:var(--text); border-radius:10px; padding:8px 10px; cursor:pointer}
    .toast{
      position:fixed; bottom:18px; right:18px; background:var(--toast-bg); color:var(--toast-fg); padding:10px 12px; border:1px solid var(--line);
      border-radius:10px; box-shadow:var(--shadow); opacity:0; transform:translateY(8px); transition:all .2s ease;
    }
    .toast.show{opacity:1; transform:translateY(0)}
    .badges{display:flex; gap:8px; flex-wrap:wrap; }
    .badge{border:1px dashed var(--line); border-radius:999px; padding:6px 10px; color:var(--muted); font-size:13px}

    /* Skills as badges */
    #skillBars { display:flex; flex-wrap:wrap; gap:8px; }
  </style>
</head>
<body data-theme="dark">
  <header>
    <div class="nav">
      <div class="brand">Pyeong Eun Kim</div>
      <button class="toggle" id="themeToggle" aria-label="Switch theme" aria-pressed="false">Dark</button>
    </div>
  </header>

  <main class="row">
    <section class="hero">
      <div class="avatar" id="avatar">PE</div>
      <div>
        <h1 id="name">Pyeong Eun Kim</h1>
        <div class="headline" id="headline">Monash Medical Student Year A</div>
        <div class="chips" id="tags"></div>
      </div>
      <div class="cta">
        <a class="btn" id="viewLinkedIn" target="_blank" rel="noopener">LinkedIn</a>
      </div>
    </section>

    <section class="card" id="about">
      <h2>About</h2>
      <p id="aboutText", class="plaintext">Placeholder</p>
      <div class="badges" id="highlights"></div>
    </section>

    <section class="card grid-2" id="experience">
      <div>
        <h2>Education</h2>
        <div class="timeline" id="eduTimeline"></div>
      </div>
      <div>
        <h2>Experience</h2>
        <div class="timeline" id="expTimeline"></div>
      </div>
    </section>

    <section class="card grid-2" id="skills">
      <div>
        <h2>Skills</h2>
        <div class="skills" id="skillBars"></div>
      </div>
      <div>
        <h2>Languages</h2>
        <div class="badges" id="languages"></div>
      </div>
    </section>

    <section class="card" id="publications">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap">
        <h2 style="margin:0">Publications</h2>
        <div class="filters" id="pubFilters"></div>
      </div>
      <div class="pubs" id="pubList"></div>
    </section>

    <section class="card" id="contact">
      <h2>Contact</h2>
      <p  class="plaintext">Feel free to contact me anytime for research collaborations.</p>
      <div class="contact-actions" style="display:flex; gap:10px; flex-wrap:wrap">
        <button class="btn alt" id="copyEmail">Copy Email</button>
        <a class="btn alt" id="openLinkedIn" target="_blank" rel="noopener">LinkedIn</a>
      </div>
    </section>

    <div class="footer"><p style="font-size:12px; font-style:italic;">Last updated 2025 Aug 12</p></div>
  </main>

  <div class="toast" id="toast">Copied to clipboard</div>

  <script>
    // ===== Editable profile data =====
    const profileData = {
      name: "Pyeong Eun Kim",
      initials: "PE",
      headline: "Monash Medical Student (Year A) | Glen Waverley, VIC, Australia",
      summary:
        "I am an AI researcher specializing in NCCT-based LVO prediction and ischemic lesion detection. From 2020 to 2024, I worked as an AI researcher at JLK Inc. I hold a BSc in Molecular Biotechnology from Ghent University and an MSc in Cancer from University College London. I am now an MD candidate at Monash University with interests in AI neuroradiology and interventional radiology. I am open to research collaborations.",
      tags: ["AI Researcher", "Neuroradiology", "Stroke AI"],
      highlights: [
        // "NCCT-based stroke pipeline (JLK-CTL, JLK-CTI)",
        // "Monash Medical Student",
        // "AI Researcher"
      ],
      linkedInUrl: "https://www.linkedin.com/in/pyeong-eun-kim-65025819b/",
      email: "pyeongeunkim@gmail.com",

      experience: [
        {
          role: "AI Researcher",
          company: "JLK",
          location: "Seoul, South Korea",
          period: "2020 — 2024",
          bullets: [
            "Developed NCCT-based LVO prediction and ischemic lesion detection pipeline for early stroke workflow. (JLK-CTL & JLK-CTI)",
            "Collaborated with tertiary hospital clinicians to validate performance of AI software in cohort and pilot studies."
          ]
        }
      ],

      education: [
        {
          degree: "MD, Medicine",
          school: "Monash University",
          period: "2025 — 2028 (expected)",
          bullets: ["Research interest: AI-based neuroradiology, interventional radiology."]
        },
        {
          degree: "MSc, Cancer",
          school: "University College London",
          period: "2019 — 2020 (graduated)",
          bullets: ["Research interest: computational biology, translational research."]
        },
        {
          degree: "BSc, Molecular Biotechnology",
          school: "Ghent University",
          period: "2015 — 2019 (graduated)",
          bullets: ["Research interest: biotechnology, bioinformatics."]
        }
      ],

      skills: [
        { name: "Multicenter Research Collaboration"},
        { name: "Statistical Analysis"},
        { name: "R" },
        { name: "Python" },
        { name: "PyTorch"},
        { name: "Computer Vision"},
        { name: "NLP"},
        { name: "Statistical Modelling"}
      ],

      languages: ["Korean (native)", "English", "Chinese"],

      scholar: {
        profileUrl: "https://scholar.google.com/citations?user=qS63YosAAAAJ&hl=en",
        maxItems: 12
      },

      publicationsFallback: [
        {
          title: "Automated Prediction of Proximal MCA Large Vessel Occlusion Using Noncontrast CT",
          venue: "Stroke",
          year: "2024",
          authors: "Kim PE, et al.",
          type: "Journal",
          links: [
            { label: "PubMed", href: "https://pubmed.ncbi.nlm.nih.gov/38787932/" },
            { label: "PMC", href: "https://pmc.ncbi.nlm.nih.gov/articles/PMC11122774/" }
          ]
        },
        {
          title: "Segmentation of the Hyperdense Artery Sign on Noncontrast CT in Ischemic Stroke Using Artificial Intelligence",
          venue: "Journal of Clinical Neurology",
          year: "2025",
          authors: "Kim PE, et al.",
          type: "Journal",
          links: [
            { label: "PubMed", href: "https://pubmed.ncbi.nlm.nih.gov/40635535/" },
            { label: "PMC", href: "https://pmc.ncbi.nlm.nih.gov/articles/PMC12303688/" }
          ]
        },
        {
          title: "Automated Prediction of Proximal MCA Large Vessel Occlusion Using Noncontrast CT",
          venue: "Stroke: Vascular and Interventional Neurology",
          year: "2025",
          authors: "JW Chung, et al.",
          type: "Journal",
          links: [
            { label: "AHA", href: "https://www.ahajournals.org/doi/full/10.1161/SVIN.125.001788" }
          ]
        }
      ]
    };

    // ===== Helpers =====
    const $ = (s) => document.querySelector(s);
    const el = (html) => { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; };

    // ===== Header/hero =====
    $("#name").textContent = profileData.name;
    $("#headline").textContent = profileData.headline;
    $("#viewLinkedIn").href = profileData.linkedInUrl;
    $("#openLinkedIn").href = profileData.linkedInUrl;
    $("#avatar").textContent = profileData.initials || "PE";
    $("#aboutText").textContent = profileData.summary;

    // Tags & highlights
    const tags = $("#tags");
    profileData.tags.forEach(t => tags.appendChild(el(`<span class="chip">${t}</span>`)));
    const highlights = $("#highlights");
    profileData.highlights.forEach(h => highlights.appendChild(el(`<span class="badge">${h}</span>`)));

    // Experience
    const exp = $("#expTimeline");
    profileData.experience.forEach((x) => {
      exp.appendChild(el(`
        <div class="item">
          <h3>${x.role} • ${x.company}</h3>
          <div class="muted">${x.location} • ${x.period}</div>
          <ul style="margin:8px 0 0 18px; padding:0;">
            ${x.bullets.map(b => `<li>${b}</li>`).join("")}
          </ul>
        </div>
      `));
    });

    // Education
    const edu = $("#eduTimeline");
    profileData.education.forEach((x) => {
      edu.appendChild(el(`
        <div class="item">
          <h3>${x.degree} • ${x.school}</h3>
          <div class="muted">${x.period}</div>
          <ul style="margin:8px 0 0 18px; padding:0;">
            ${x.bullets.map(b => `<li>${b}</li>`).join("")}
          </ul>
        </div>
      `));
    });

    // Skills as badges
    const skillsWrap = $("#skillBars");
    skillsWrap.innerHTML = "";
    profileData.skills.forEach(s => {
      skillsWrap.appendChild(el(`<span class="badge">${s.name}</span>`));
    });

    // Languages
    const langWrap = $("#languages");
    profileData.languages.forEach(a => langWrap.appendChild(el(`<span class="badge">${a}</span>`)));

    // Publications
    const pubList = $("#pubList");
    const pubFilters = $("#pubFilters");
    let activePubFilter = "All";

    function renderPublications(items) {
      pubList.innerHTML = "";
      items.forEach(p => {
        const links = (p.links || []).map(l => `<a href="${l.href}" target="_blank" rel="noopener">${l.label}</a>`).join(" • ");
        pubList.appendChild(el(`
          <div class="pub">
            <div class='pub_title'><strong>${p.title}</strong></div>
            <div class="meta">
              <span>${p.authors || ""}</span>
              ${p.venue ? `<span>• ${p.venue}</span>` : ""}
              ${p.year ? `<span>• ${p.year}</span>` : ""}
              ${p.type ? `<span>• ${p.type}</span>` : ""}
            </div>
            ${links ? `<div class="small" style="margin-top:6px">${links}</div>` : ""}
          </div>
        `));
      });
    }
   

    function inferTypeFromVenue(venue = "") {
      const v = venue.toLowerCase();
      if (v.includes("conference") || v.includes("proceedings")) return "Conference";
      if (v.includes("stroke") || v.includes("journal") || v.includes("jnis") || v.includes("bmc")) return "Journal";
      return "Other";
    }

    function buildFiltersAndRender(all) {
      const types = Array.from(new Set(all.map(p => p.type || "Other")));

      const update = () => {
        const filtered = activePubFilter === "All" ? all : all.filter(p => p.type === activePubFilter);
        renderPublications(filtered);
      };

      pubFilters.innerHTML = "";
      ["All", ...types].forEach(t => {
        const b = el(`<button class="btn alt small" type="button">${t}</button>`);
        if (t === activePubFilter) { b.style.borderColor = "var(--accent2)"; b.style.color = "var(--accent2)"; }
        b.addEventListener("click", () => { activePubFilter = t; buildFiltersAndRender(all); });
        pubFilters.appendChild(b);
      });

      pubFilters.appendChild(el(
        `<a class="btn alt small" href="${profileData.scholar.profileUrl}" target="_blank" rel="noopener">View on Scholar</a>`
      ));

      update();
    }

    (function loadPublications(){
      const curated = profileData.publicationsFallback.map(p => ({ ...p, type: p.type || inferTypeFromVenue(p.venue) }));
      buildFiltersAndRender(curated);
    })();

    // ===== Contact actions =====
    const toast = $("#toast");
    const showToast = (msg = "Copied!") => { toast.textContent = msg; toast.classList.add("show"); setTimeout(()=>toast.classList.remove("show"), 1500); };
    $("#copyEmail").addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(profileData.email); showToast("Email copied!"); } catch { showToast("Copy failed."); }
    });

    // ===== Theme toggle =====
    const root = document.body;
    const themeBtn = $("#themeToggle");
    const getSystemTheme = () => (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    let theme = localStorage.getItem("theme") || getSystemTheme();
    const applyTheme = (t) => {
      root.dataset.theme = t;
      const next = t === 'dark' ? 'Light' : 'Dark';
      themeBtn.textContent = t === 'dark' ? 'Dark' : 'Light';
      themeBtn.setAttribute('aria-label', `Switch to ${next} mode`);
      themeBtn.setAttribute('aria-pressed', t === 'dark');
    };
    applyTheme(theme);
    themeBtn.addEventListener("click", () => {
      theme = theme === "dark" ? "light" : "dark";
      localStorage.setItem("theme", theme);
      applyTheme(theme);
    });

    const mql = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
    if (mql && !localStorage.getItem('theme')) {
      mql.addEventListener('change', (e) => { theme = e.matches ? 'dark' : 'light'; applyTheme(theme); });
    }
  </script>
</body>
</html>
